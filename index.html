<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الطلبيات</title>
<link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1f3fa8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap">
<style>
/* Layout: branch grid → one order sheet with a sticky totals bar; history as expandable cards */
:root{
  --bg:#f2f4f8; --card:#ffffff; --line:#dfe4ee; --ink:#14213d; --muted:#5f6b84;
  --accent:#1f3fa8; --accent-ink:#ffffff; --accent-soft:#e8edfb; --fill:#f1f5ff;
  --ok:#157a46; --ok-soft:#e3f4ea; --warn:#b45f06; --bad:#b4232b; --bad-soft:#fbe6e7;
  --grp:#b35309; --grp-soft:#fdf2e6; --sep:#0f766e; --sep-soft:#e2f4f1;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131d; --card:#161d2b; --line:#28324a; --ink:#e7ecf6; --muted:#98a3ba;
  --accent:#8aa4ff; --accent-ink:#0e131d; --accent-soft:#1d2848; --fill:#18223a;
  --ok:#5bcf91; --ok-soft:#14301f; --warn:#f0b05e; --bad:#ff8a84; --bad-soft:#3a1b1c;
  --grp:#f2a15a; --grp-soft:#33230f; --sep:#4fd1c0; --sep-soft:#10302c;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131d; --card:#161d2b; --line:#28324a; --ink:#e7ecf6; --muted:#98a3ba;
  --accent:#8aa4ff; --accent-ink:#0e131d; --accent-soft:#1d2848; --fill:#18223a;
  --ok:#5bcf91; --ok-soft:#14301f; --warn:#f0b05e; --bad:#ff8a84; --bad-soft:#3a1b1c;
  --grp:#f2a15a; --grp-soft:#33230f; --sep:#4fd1c0; --sep-soft:#10302c;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.45rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1px solid var(--line);background:var(--card);border-radius:12px;height:42px;padding:0 14px;display:flex;align-items:center;gap:6px;font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:42px;padding:0 14px;font-weight:600;white-space:nowrap}
.sync{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)}

h2.sec{font-size:.85rem;font-weight:600;color:var(--muted);margin:0 0 -6px;letter-spacing:.01em}

/* company chips */
.chips.region .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;height:40px;padding:0 14px;font-size:.9rem;font-weight:500}
.chip img{height:22px;width:auto;border-radius:3px;background:#fff}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}

/* branch grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.bcard{text-align:right;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);position:relative;min-height:84px}
.bcard:hover{border-color:var(--accent)}
.bcard b{font-size:1.02rem;padding-left:16px}
.bcard span{font-size:.8rem;color:var(--muted)}
.bcard .dot{position:absolute;top:18px;left:14px}
.bcard.ok .dot{background:var(--ok)} .bcard.mid .dot{background:var(--warn)} .bcard.late .dot{background:var(--bad)}
.bcard.open{border-color:var(--accent);background:var(--accent-soft)}
.bcard.open span{color:var(--accent);font-weight:600}
.bcard.late span{color:var(--bad)}

.cgrp{display:flex;flex-direction:column;gap:10px}
.cgh{display:flex;align-items:center;gap:10px;padding:2px 2px}
.cgh img{height:30px;width:auto;background:#fff;border-radius:6px;padding:2px 4px;border:1px solid var(--line)}
.cgh .cgi{width:34px;height:30px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.cgh b{font-size:1rem}.cgh span{font-size:.8rem;color:var(--muted);margin-inline-start:auto}
.cobadge{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;align-self:flex-start}
.cobadge img{height:26px;width:auto;background:#fff;border-radius:4px}
.cobadge b{font-size:.92rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .search{flex:1 1 180px}
.tlist{list-style:none;margin:0;padding:0}
.tq.adj,.mt.adj{color:#b45309}.tq.adj::before{content:"✎ ";font-size:.8em}
.adjbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:4px 16px 10px}.adjbox label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.adjq{width:90px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center;font-size:1rem;font-weight:700}
.adjc{font-size:.82rem;color:var(--mute,#888)}.adjx{width:auto;padding:4px 8px}
.adjadd{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.adjadd input[name=n]{flex:1;min-width:160px}.adjadd input,.adjadd select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 10px}.adjadd input[name=q]{width:80px}
.dhead{font-weight:800;padding:8px 16px;font-size:.95rem;color:#fff}.dhead td{padding:8px 12px!important;text-align:right!important;font-weight:800;color:#fff}
.dhead.d0,.dhead.d0 td{background:#b45309}.dhead.d1,.dhead.d1 td{background:#1f3fa8}.dhead.d2,.dhead.d2 td{background:#0f766e}
.trow{border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}
.thead{width:100%;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) auto;gap:12px;align-items:center;padding:12px 16px;background:none;border:0;text-align:right}
.thead:hover{background:var(--fill)}
.trow.open{background:var(--fill)}
.tn{font-weight:600;min-width:0;overflow-wrap:anywhere}.tn small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.tbar{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tq{font-size:1rem;white-space:nowrap;text-align:left}
.tby{list-style:none;margin:0;padding:0 16px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px}
.tby li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.mwrap{overflow-x:auto}
.matrix{border-collapse:collapse;min-width:100%;font-size:.85rem}
.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center;white-space:nowrap}
.matrix th{position:sticky;top:0;background:var(--bg);font-weight:700;color:var(--muted)}
.matrix .mn{text-align:right;position:sticky;right:0;background:var(--card);font-weight:600}
.matrix th.mn{background:var(--bg)}
.matrix .mt{font-weight:800;color:var(--accent)}
@media (max-width:520px){.thead{grid-template-columns:minmax(0,1fr) auto}.thead .tbar{grid-column:1/-1;grid-row:2}}
/* list cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.sent{height:34px;border-radius:99px;border:1px solid transparent;padding:0 10px;font-size:.8rem;font-weight:700;cursor:pointer}
.sent.yes{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.sent.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--fill)}
.rdate{font-size:.82rem;color:var(--muted);min-width:58px}
.rtitle{font-weight:600;min-width:0}
.rtitle small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:12px 16px;width:100%;text-align:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* order screen */
.ohead{display:flex;flex-direction:column;gap:12px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.date-in{border:1px solid var(--line);background:var(--card);border-radius:10px;height:40px;padding:0 10px}
.search{display:block;flex:1;min-width:150px;-webkit-appearance:none;appearance:none;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;height:40px;padding:0 12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kindbar{align-self:flex-start;font-weight:700;font-size:.85rem;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.kindbar.chem{background:#efe9fd;color:#6d28d9}
.tabs.mode .tabb[aria-selected="true"]{box-shadow:0 0 0 2px var(--accent) inset}
.tabb{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right}
.tabb b{font-size:1rem}.tabb span{font-size:.78rem;color:var(--muted)}
.tabb[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tabb[aria-selected="true"] span{color:var(--accent)}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:28px 1fr 84px 74px 36px;gap:8px;align-items:center;padding:8px 12px 8px 8px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.unit{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:.85rem;padding:0 4px;color:var(--muted);min-width:0}
.it.has .unit{color:var(--ink)}
.it .n{font-size:.78rem;color:var(--muted);text-align:center}
.it .nm{min-width:0;overflow-wrap:anywhere}
.it.has{background:var(--fill)}
.it.has .nm{font-weight:600}
.qty{width:84px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:center;font-size:1.15rem;font-weight:700}
.qty:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.it.has .qty{border-color:var(--accent)}
.del{width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:8px;font-size:1.2rem;line-height:1}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.ghead{padding:8px 16px;font-size:.82rem;font-weight:700;border-bottom:1px solid var(--line)}
.ghead.g{background:var(--grp-soft);color:var(--grp)}
.ghead.s{background:var(--sep-soft);color:var(--sep);height:8px;padding:0}
.it.g{box-shadow:inset -4px 0 0 var(--grp)} .it.s{box-shadow:inset -4px 0 0 var(--sep)}
.add{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line);background:var(--bg)}
.add input,.add select{border:1px solid var(--line);background:var(--card);border-radius:10px;height:42px;padding:0 10px;min-width:0}
.add .a-name{flex:1 1 160px}
.add .a-qty{width:76px;text-align:center}
.btn{border:0;border-radius:12px;height:44px;padding:0 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.regprint{width:100%;margin:2px 0 6px;height:48px;font-size:1rem}.btn.regprint:disabled{opacity:.5}
.btn.small{height:38px;padding:0 14px;font-size:.9rem}
.danger-zone{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

/* sticky totals bar */
.foot{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,33,61,.06);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:8px}
.tot{flex:1;min-width:0;line-height:1.25}
.tot b{font-size:1.25rem;font-family:var(--f-display)}
.tot span{display:block;font-size:.78rem;color:var(--muted)}

/* history */
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hstats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.hstats b{display:block;font-family:var(--f-display);font-size:1.5rem;line-height:1.2}
.hstats span{font-size:.8rem;color:var(--muted)}
.hgroup{padding:8px 16px;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.hx{padding:4px 16px 16px;background:var(--fill);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.hx p{margin:0;font-size:.85rem;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
.dl li{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.dl li span{flex:1;min-width:0}
.dl em{font-style:normal;font-size:.72rem;white-space:nowrap}
em.up{color:var(--warn)} em.down{color:var(--ok)} em.new{color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;text-decoration:underline;padding:0}
@media (max-width:520px){
  .brand{font-size:1.25rem}
  .it{grid-template-columns:20px 1fr 64px 62px 28px;gap:6px;padding-inline:6px 2px}
  .qty{width:64px!important}.unit{font-size:.78rem}
  .qty{width:76px}
  .hstats b{font-size:1.25rem}
  .sync span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>


<div class="app" id="app" dir="rtl" lang="ar"></div>
<div class="foot" id="foot" hidden dir="rtl"></div>
<div class="toast" id="toast" hidden dir="rtl"></div>

<script>
const BACKEND="fetch";
const API_URL="https://script.google.com/macros/s/AKfycbyXZxos3MXpsg2y97AI4g0P7SD09OUbRQGPWu0BVsRTzDk-DNubIeFYxdRqJ8-XKeSa3w/exec";
const BRANCHES={
  "شركة الشروق":["مول مصر","سيتي سنتر الماظة","سيتي سنتر المعادي","اسكندرية","زد بارك"],
  "شركة بروفيشنال ليدرز":["مول العرب","اركان بلازا","مازار","السخنة","تاون سنتر","جولدن جيت","يوفينوس","سينما اركان"],
  "شركة ماس":["كايرو فيستيفال سيتي","مباني ادارية"]
};
const COMPANIES=Object.keys(BRANCHES);
const SITES=COMPANIES.flatMap(c=>BRANCHES[c]);
const SITE_CO=Object.fromEntries(COMPANIES.flatMap(c=>BRANCHES[c].map(s=>[s,c])));
const OCT=["مول مصر","مول العرب","اركان بلازا","سينما اركان","زد بارك","مازار"];
const REGIONS=["التجمع","أكتوبر"];
const regionOf=s=>OCT.includes(s)?"أكتوبر":"التجمع";
const RENAME={"كايرو فيستيفال":"كايرو فيستيفال سيتي"};
const GROUPS=["بيومي سبايدر"];
const TOOLS="أدوات نظافة", CHEM="كيميكال", CATS=[TOOLS,CHEM];
/* الأصناف الثابتة: بتظهر في كل طلبية بعدد صفر */
const CATALOG={
  [TOOLS]:[
    "مقشة ناعمة","مقشة خشنة","مقشة سوداء","مقشة خضراء","مقشة ناعمة أزرق",
    "يد معدن","يد معدن تقيل","يد معدن للشرشوبة","يد معدن الوايبر","يد معدن أخضر","يد سوداء","يد أحمر","يد أخضر","يد موب",
    "مساحة معدن","مساحة بلاستيك","مساحة بلاستيك حمراء",
    "جاروف قلاب","جاروف أزرق","جاروف أخضر","جاروف أحمر",
    "فرش موب","فرش موب أحمر","فرش موب أخضر","فرش موب أزرق","عضم موب","شرشوبة",
    "بلة كاملة","غيار بلة",
    "فوط مايكروفايبر","فوط مايكروفايبر أحمر","فوط مايكروفايبر أخضر","فوط مايكروفايبر أصفر","فوط مايكروفايبر أزرق",
    "فوطة مايكروفايبر 3M","فوط قطن","فوط قطن خضراء","فوط قطن حمراء","فوط قطن زرقاء","فوط عش نملة","فوط أرضيات","طرحة سوداء",
    "إكسويزر 25 سم","إكسويزر 35 سم","إكسويزر بلاستيك","إكسويزر أحمر بلاستيك","غيار جلد إكسويزر 25 سم","غيار جلد إكسويزر إيطالي 35 سم","غيار جلد إكسويزر إيطالي 45 سم",
    "سبونشة خشنة","سبونشة لباد",{name:"سلك مواعين",unit:"لفة"},
    "فرشة مكوي","فرشة أرضيات","فرشة قواعد","زعافة كورة",

const ar=n=>String(n??"").replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);

const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

const filled=o=>(o.items||[]).filter(i=>qtyOf(i)>0);

const kindOf=o=>o.kind||((o.items||[]).filter(i=>(+i.qty||0)>0).length&&(o.items||[]).filter(i=>(+i.qty||0)>0).every(i=>catOf(i)==="كيميكال")?"كيميكال":"أدوات نظافة");
const inRegion=o=>!region||regionOf(o.site)===region;
const ofMode=o=>kindOf(o)===mode&&inRegion(o);
if(coFilter&&!COMPANIES.includes(coFilter))coFilter="";
const saved=()=>orders.filter(o=>!o.unsaved);
/* تعديلات الإجمالي (الكميات اللي بتتطلب فعلاً من المورد) — متخزنة في سجل خاص __adj */
let adjRec={id:"__adj",title:"تعديلات الإجمالي",items:[],adj:{}};
const adjKey=name=>{const {m,pm}=periodRange();return [tPeriod==="all"?"all":tPeriod==="month"?m:pm,mode,region||"*",coFilter||"*",name].join("|")};
const adjPrefix=()=>adjKey("");
function setAdj(name,q,u){const k=adjKey(name);if(q==null||q==="")delete adjRec.adj[k];else adjRec.adj[k]={q:+q,u:u||""};persist(adjRec);render()}
const byNewest=(a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0);
const cur=()=>orders.find(o=>o.id===curId);

/* ---------- storage ---------- */
const timers={}, queues={};
let store={save:()=>Promise.resolve(),del:()=>Promise.resolve()};
function setSync(on,txt){const d=$("#syncDot"),t=$("#syncTxt");if(d)d.classList.toggle("on",on);if(t)t.textContent=txt;syncState=[on,txt]}
let syncState=[false,"جاري التحميل…"];
function persist(o){
  delete o.unsaved;o.updatedAt=Date.now();
  const id=o.id;
  queues[id]=(queues[id]||Promise.resolve()).then(()=>store.save(clone(o)))
    .then(()=>setSync(true,"اتحفظ"))
    .catch(()=>{setSync(false,"الحفظ ما تمّش");toast("الحفظ ما تمّش، اتأكد من النت وجرّب تاني")});
}
function persistSoon(o){clearTimeout(timers[o.id]);timers[o.id]=setTimeout(()=>{delete timers[o.id];persist(o)},700)}
function flush(){for(const id in timers){clearTimeout(timers[id]);delete timers[id];const o=orders.find(x=>x.id===id);if(o)persist(o)}}
const typing=()=>{const a=document.activeElement;return a&&a.tagName==="INPUT"&&a.closest("#app")};
function merge(list){
  const local=new Map(orders.map(o=>[o.id,o]));
  const meta=list.find(b=>b.id==="__adj");if(meta&&!timers.__adj&&(meta.updatedAt||0)>=(adjRec.updatedAt||0))adjRec={...meta,adj:meta.adj||{}};
  list=list.filter(b=>!String(b.id).startsWith("__"));
  orders=list.map(b=>{b.items=b.items||[];if(RENAME[b.site]){b.title=(b.title||"").replace(b.site,RENAME[b.site]);b.site=RENAME[b.site]}if(!b.company&&SITE_CO[b.site])b.company=SITE_CO[b.site];b.items.forEach(normItem);const m=local.get(b.id);return m&&((m.updatedAt||0)>(b.updatedAt||0)||timers[b.id])?m:b});
  local.forEach(o=>{if(o.unsaved&&!orders.some(x=>x.id===o.id))orders.push(o)});
  ready=true;
  if(view==="order"&&typing())renderFoot();else render();
}

async function boot(){
  if(BACKEND==="claude"){
    let db=null;try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){}
    if(!db){
      const K="ord.local";
      try{orders=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){}
      store={save:()=>{try{localStorage.setItem(K,JSON.stringify(saved()))}catch(e){}return Promise.resolve()},del:()=>{try{localStorage.setItem(K,JSON.stringify(saved()))}catch(e){}return Promise.resolve()}};
      ready=true;setSync(false,"محفوظ على الجهاز ده بس");render();return;
    }
    store={save:o=>{const {id,...b}=o;return db.collection("orders").doc(id).set(b)},del:id=>db.collection("orders").doc(id).delete()};
    db.collection("orders").onSnapshot(s=>{setSync(true,"متزامن");merge(s.docs.map(d=>({id:d.id,...clone(d.data())})))},()=>setSync(false,"الاتصال وقف، اعمل تحديث"));
    return;
  }
  const call=BACKEND==="gas"
    ?(fn,...a)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a))
    :(fn,...a)=>{
      if(fn==="listOrders")return fetch(API_URL+"?action=list&t="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});
      const body=fn==="saveOrder"?{action:"save",order:a[0]}:{action:"delete",id:a[0]};
      return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);return true});
    };
  store={save:o=>call("saveOrder",JSON.stringify(o)),del:id=>call("deleteOrder",id)};
  const pull=()=>call("listOrders").then(t=>{setSync(true,"متزامن مع الشيت");merge(JSON.parse(t))}).catch(()=>{setSync(false,"مش قادر يوصل للشيت");if(!ready){ready=true;render()}});
  await pull();
  setInterval(()=>{if(!document.hidden&&!Object.keys(timers).length&&!typing())pull()},30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!typing())pull()});
}

/* ---------- toast ---------- */
let toastT=null,toastUndo=null;
function toast(msg,undo){
  const el=$("#toast");toastUndo=undo||null;
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button" id="undoBtn">رجّع</button>`:""}`;
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;toastUndo=null},undo?5000:2400);
}

/* ---------- catalog / drafts ---------- */
function catalog(){
  const seen=new Map();
  saved().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(o=>(o.items||[]).forEach(i=>{const k=i.name.trim();if(!seen.has(k))seen.set(k,i)}));
  return [...seen.values()];
}
function openDraftFor(site){
  const c=orders.filter(o=>o.site===site&&o.status!=="اكتملت"&&ofMode(o)).sort(byNewest);
  return c.find(o=>o.unsaved||filled(o).length)||c[0];
}
function openBranch(site){
  let o=openDraftFor(site);
  if(o&&SITE_CO[site]&&o.company!==SITE_CO[site]){o.company=SITE_CO[site];if(!o.unsaved)persist(o)}
  if(!o){
    const prev=saved().filter(x=>x.site===site&&ofMode(x)).sort(byNewest)[0];
    o={id:"o"+Date.now().toString(36)+uid().slice(0,3),unsaved:true,kind:mode,site,company:SITE_CO[site]||(prev&&prev.company)||"",
       title:"طلبية "+site+(mode===CHEM?" - كيميكال":""),date:today(),status:"مسودة",createdAt:Date.now(),items:withCatalog((prev?prev.items:[]).map(i=>copyItem(i,0)),true,mode)};
    orders.push(o);
  }
  else{if(!o.kind)o.kind=kindOf(o);o.items=withCatalog(o.items||[],false,o.kind)}
  go("order",o.id);
}
function go(v,id){flush();view=v;if(id)curId=id;if(view==="order"&&cur())tab=kindOf(cur());itemQ="";confirmDel=false;render();window.scrollTo(0,0)}

/* ---------- render ---------- */
function render(){
  const app=$("#app");
  if(!ready){app.innerHTML=topBar()+`<div class="card"><div class="empty">جاري تحميل الطلبيات…</div></div>`;$("#foot").hidden=true;return}
  if(view==="order"&&!cur())view="home";
  app.innerHTML=view==="order"?renderOrder():view==="history"?renderHistory():view==="totals"?renderTotals():renderHome();
  renderFoot();
}
function topBar(title,back){
  return `<header class="top">
    ${back?`<button class="back" data-go="home" type="button" aria-label="رجوع للفروع">→ الفروع</button>`:""}
    <h1 class="brand">${esc(title||"دفتر الطلبيات")}</h1>
    <div class="sync" title="${esc(syncState[1])}"><i class="dot ${syncState[0]?"on":""}" id="syncDot"></i><span id="syncTxt">${esc(syncState[1])}</span></div>
    ${!back&&view!=="totals"?`<button class="iconbtn" data-go="totals" type="button">الإجمالي</button>`:""}
    ${!back&&view!=="history"?`<button class="iconbtn" data-go="history" type="button">السجل</button>`:""}
    ${view==="history"||view==="totals"?`<button class="iconbtn" data-go="home" type="button">الفروع</button>`:""}
  </header>`;
}
function coChips(sel,attr,withAll){
  return `<div class="chips" role="group">${withAll?`<button type="button" class="chip" ${attr}="" aria-pressed="${!sel}">كل الشركات</button>`:""}${COMPANIES.map(c=>`<button type="button" class="chip" ${attr}="${esc(c)}" aria-pressed="${sel===c}">${LOGOS[c]?`<img src="${LOGOS[c]}" alt="">`:""}${esc(c.replace("شركة ",""))}</button>`).join("")}</div>`;
}
function renderHome(){
  const list=saved().filter(o=>(!coFilter||o.company===coFilter)&&ofMode(o));
  const card=s=>{
    const draft=orders.find(o=>o.site===s&&o.status!=="اكتملت"&&filled(o).length&&ofMode(o));
    const last=list.filter(o=>o.site===s&&o.status==="اكتملت").sort(byNewest)[0];
    const d=last?daysAgo(last.date):null;
    let cls=d==null?"":d>30?"late":d>14?"mid":"ok", sub;
    if(draft){cls="open";sub=`طلبية مفتوحة · ${ar(filled(draft).length)} صنف`}
    else sub=d==null?"لسه مفيش طلبيات":d===0?"آخر طلبية النهارده":d===1?"آخر طلبية امبارح":`آخر طلبية من ${ar(d)} يوم`;
    return `<button type="button" class="bcard ${cls}" data-site="${esc(s)}"><i class="dot"></i><b>${esc(s)}</b><span>${sub}</span></button>`;
  };
  const groups=COMPANIES.filter(c=>(!coFilter||c===coFilter)&&BRANCHES[c].some(b=>!region||regionOf(b)===region)).map(c=>`<section class="cgrp">
    <div class="cgh">${LOGOS[c]?`<img src="${LOGOS[c]}" alt="">`:`<span class="cgi">${esc(c.replace("شركة ","").slice(0,1))}</span>`}<b>${esc(c)}</b><span class="num">${ar(BRANCHES[c].filter(b=>!region||regionOf(b)===region).length)} فرع</span></div>
    <div class="grid">${BRANCHES[c].filter(b=>!region||regionOf(b)===region).map(card).join("")}</div></section>`).join("");
  const recent=list.filter(o=>filled(o).length).sort(byNewest);
  return topBar()+`
  ${coChips(coFilter,"data-cof",true)}
  ${modeSwitch()}
  <h2 class="sec">اختار الفرع عشان تبدأ طلبية ${mode===CHEM?"كيميكال":"أدوات نظافة"}</h2>
  ${groups}
  <h2 class="sec">كل الطلبيات (${ar(recent.length)})</h2>
  <div class="card">${recent.map(rowHtml).join("")||`<div class="empty">لسه مفيش طلبيات</div>`}
    ${recent.length?`<button type="button" class="linkbtn" data-go="history">السجل والتفاصيل ←</button>`:""}</div>`;
}
function sentSel(o){
  return `<select class="sent ${o.sent?"yes":"no"}" data-sent="${o.id}" aria-label="حالة إرسال ${esc(o.title)}"><option value="0" ${o.sent?"":"selected"}>لم يتم إرسالها</option><option value="1" ${o.sent?"selected":""}>تم إرسالها</option></select>`;
}
function regionBatch(){
  const latest={};
  saved().filter(o=>kindOf(o)===CHEM&&inRegion(o)&&filled(o).length&&(!coFilter||o.company===coFilter)).sort(byNewest)
    .forEach(o=>{if(!latest[o.site])latest[o.site]=o});
  const order=COMPANIES.flatMap(c=>BRANCHES[c]);const ix=s=>{const i=order.indexOf(s);return i<0?999:i};
  return Object.values(latest).sort((a,b)=>ix(a.site)-ix(b.site));
}
function regPrintBtn(){
  if(mode!==CHEM||!region||view==="totals")return "";
  const n=regionBatch().length;
  return `<button type="button" class="btn regprint" id="regPrint" ${n?"":"disabled"}>🖨️ طباعة كيميكال ${esc(region)}<span class="num"> (${ar(n)} ${n>2&&n<11?"فروع":"فرع"})</span></button>`;
}
function printRegion(){
  const L=regionBatch();if(!L.length){toast("مفيش طلبيات كيميكال في "+region);return}
  const docs=L.map(receiptHtml);
  const style=docs[0].match(/<style>[\s\S]*?<\/style>/)[0];
  const body=d=>d.split("<body>")[1].split("<script>")[0];
  const html=`<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>كيميكال ${esc(region)}</title>${style}<style>.pg{break-inside:avoid;page-break-inside:avoid;padding-bottom:10px;margin-bottom:12px;border-bottom:2px dashed #999}.pg:last-child{border:0;margin:0}</style></head><body>`
    +docs.map(d=>`<div class="pg">${body(d)}</div>`).join("")
    +`<script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>`;
  printHtml(html,"كيميكال "+region);

function regionChips(){
  return `<div class="chips region">${[["","كل المناطق"],...REGIONS.map(r=>[r,r])].map(([k,l])=>`<button type="button" class="chip" data-region="${k}" aria-pressed="${region===k}">${l}</button>`).join("")}</div>`;
}
function modeSwitch(noReg){
  return (noReg?"":regionChips())+`<div class="tabs mode" role="tablist">${CATS.map(c=>{const n=saved().filter(o=>kindOf(o)===c&&inRegion(o)&&filled(o).length&&(!coFilter||o.company===coFilter)).length;
    return `<button type="button" role="tab" class="tabb" data-mode="${c}" aria-selected="${mode===c}"><b>${c}</b><span class="num">${ar(n)} طلبية</span></button>`}).join("")}</div>`+regPrintBtn();

function rowHtml(o,mode){

function itemRow(it,n){

    <button type="button" class="del" data-del="${it.id}" aria-label="شيل ${esc(it.name)}">×</button></li>`;

function renderOrder(){
  const o=cur();const all=o.items||[];const items=all.filter(i=>catOf(i)===tab);const q=itemQ.trim();
  const tabs=`<div class="tabs" role="tablist">${CATS.map(c=>{const ci=all.filter(i=>catOf(i)===c);const f=ci.filter(i=>qtyOf(i)>0).length;
    return `<button type="button" role="tab" class="tabb" data-tab="${c}" aria-selected="${tab===c}"><b>${c}</b><span class="num">${f?ar(f)+" مكتوب":ar(ci.length)+" صنف"}</span></button>`}).join("")}</div>`;

    <form class="add" id="addForm" autocomplete="off">

function prevOf(o){return saved().filter(x=>x.id!==o.id&&x.site===o.site&&x.status==="اكتملت"&&byNewest(o,x)<0).sort(byNewest)[0]}

/* ---------- totals ---------- */
const ymOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
function periodRange(){
  const now=new Date(), m=ymOf(now), pd=new Date(now.getFullYear(),now.getMonth()-1,1), pm=ymOf(pd);
  return {m,pm};
}
const PERIODS=[["month","الشهر ده"],["prev","الشهر اللي فات"],["all","كل الفترات"]];
function periodLabel(){const {m,pm}=periodRange();return tPeriod==="month"?mName(m):tPeriod==="prev"?mName(pm):"كل الفترات"}
function totalsData(){
  const {m,pm}=periodRange();
  const os=saved().filter(o=>ofMode(o)&&filled(o).length&&(!coFilter||o.company===coFilter)
    &&(tPeriod==="all"||(o.date||"").startsWith(tPeriod==="month"?m:pm))
    &&(tSent==="all"||(tSent==="sent"?!!o.sent:!o.sent)));
  const map=new Map();
  os.forEach(o=>filled(o).filter(i=>catOf(i)===mode).forEach(i=>{
    let a=map.get(i.name);if(!a){a={name:i.name,dept:deptOf(i.name),units:{},by:{},sum:0};map.set(i.name,a)}
    const u=i.unit||"";a.units[u]=(a.units[u]||0)+qtyOf(i);a.sum+=qtyOf(i);
    const b=a.by[o.site]||(a.by[o.site]={});b[u]=(b[u]||0)+qtyOf(i);
  }));
  const order=new Map();CATS.forEach(c=>CATALOG[c].forEach((e,k)=>order.set(e.name||e,order.size)));
  let rows=[...map.values()];
  const pre=adjPrefix();
  Object.entries(adjRec.adj||{}).forEach(([k,v])=>{if(!k.startsWith(pre))return;const n=k.slice(pre.length);
    let r=rows.find(x=>x.name===n);
    if(!r){if(!(v.q>0))return;r={name:n,dept:deptOf(n),units:{},by:{},sum:0,extra:true};rows.push(r)}
    r.calc=r.units;r.units=v.q>0?{[v.u||""]:v.q}:{};r.sum=v.q;r.adj=true;});
  rows=rows.filter(r=>r.sum>0||r.adj&&!r.extra);
  rows.sort(tSort==="qty"?(a,b)=>b.sum-a.sum:tSort==="name"?(a,b)=>a.name.localeCompare(b.name,"ar"):(a,b)=>(order.get(a.name)??1e9)-(order.get(b.name)??1e9));
  rows.sort((a,b)=>DEPTS.indexOf(a.dept)-DEPTS.indexOf(b.dept));
  const deptN=Object.fromEntries(DEPTS.map(d=>[d,rows.filter(r=>r.dept===d).length]));
  if(tDept)rows=rows.filter(r=>r.dept===tDept);
  const sites=[...new Set(os.filter(o=>!tDept||filled(o).some(i=>deptOf(i.name)===tDept&&catOf(i)===mode)).map(o=>o.site))].sort((a,b)=>SITES.indexOf(a)-SITES.indexOf(b));
  return {os,rows,sites,deptN};
}

async function printHtml(html,name){
  if(BACKEND==="claude"){
    let dl=null;try{dl=await window.claude?.use?.("downloads")}catch(e){}
    if(!dl){toast("الطباعة مش متاحة هنا");return}
    try{await dl.save({filename:(name).replace(/[\\/:*?"<>|]/g,"-")+".html",data:html});toast("افتح الملف اللي نزل وهتفتح الطباعة")}
    catch(e){if(e&&e.code!=="declined")toast("التنزيل ما تمّش")}
    return;
  }
  let w=null;try{w=window.open("","_blank")}catch(e){}
  if(w){w.document.open();w.document.write(html);w.document.close();return}
  let f=$("#printFrame");
  if(!f){f=document.createElement("iframe");f.id="printFrame";f.style.cssText="position:fixed;width:0;height:0;border:0";document.body.appendChild(f)}
  f.srcdoc=html.replace(/<script>[\s\S]*?<\/script>/,"");
  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast("المتصفح منع الطباعة، اسمح بالـ pop-ups")}};
}

function copyText(t){

  const fb=()=>{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){toast("حدّد النص وانسخه")}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(fb);else fb();

document.addEventListener("click",e=>{

  if(d.region!=null){region=d.region;try{localStorage.setItem("ord.region",region)}catch(_){}render();return}
  if(d.mode!=null){mode=d.mode;try{localStorage.setItem("ord.mode",mode)}catch(_){}hOpen.clear();render();return}
  if(d.site!=null){openBranch(d.site);return}
  if(d.cof!=null){coFilter=d.cof;try{localStorage.setItem("ord.co",coFilter)}catch(_){}render();return}
  if(d.open!=null){go("order",d.open);return}

  if(d.print!=null){const o=orders.find(x=>x.id===d.print);if(o)printOrder(o);return}

    orders=orders.filter(x=>!(x.unsaved&&x.site===s.site));
    const n={id:"o"+Date.now().toString(36)+uid().slice(0,3),kind:kindOf(s),site:s.site,company:s.company||"",title:s.title,date:today(),status:"مسودة",createdAt:Date.now(),items:(s.items||[]).map(i=>copyItem(i,qtyOf(i)))};
    orders.push(n);persist(n);go("order",n.id);toast("اتعملت طلبية جديدة بنفس الكميات");return;

  if(d.del!=null){
    const idx=o.items.findIndex(i=>i.id===d.del);if(idx<0)return;
    const [it]=o.items.splice(idx,1);persist(o);render();
    toast("اتشال "+it.name,()=>{o.items.splice(idx,0,it);persist(o);render()});return;
  }
  if(t.id==="printBtn"){flush();printOrder(o);return}
  if(t.id==="doneBtn"){
    if(!filled(o).length){toast("اكتب العدد قدام الأصناف الأول");return}
    o.status="اكتملت";persist(o);go("home");toast(`اتحفظت ${o.title} · ${ar(total(o))} قطعة`);return;
  }
  if(t.id==="copyWa"){copyText(waText(o));return}
  if(t.id==="askDel"){confirmDel=true;render();return}
  if(t.id==="noDel"){confirmDel=false;render();return}
  if(t.id==="yesDel"){const id=o.id;orders=orders.filter(x=>x.id!==id);if(!o.unsaved)store.del(id).catch(()=>toast("الحذف ما تمّش"));go("home");toast("الطلبية اتحذفت");return}
});
document.addEventListener("change",e=>{const el=e.target;if(el.classList&&el.classList.contains("adjq")){setAdj(el.dataset.adjn,el.value===""?null:Math.max(0,+el.value),el.dataset.adju)}});
document.addEventListener("submit",e=>{if(e.target.id!=="adjAdd")return;e.preventDefault();const f=e.target;const n=f.n.value.trim(),q=+f.q.value;if(!n||!(q>0))return;tOpen.add(n);setAdj(n,q,f.u.value)});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="tQ"){tQ=el.value;const p=el.selectionStart;render();const n=$("#tQ");n.focus();n.setSelectionRange(p,p);return}
  if(el.id==="hQ"){hQ=el.value;const p=el.selectionStart;render();const n=$("#hQ");n.focus();n.setSelectionRange(p,p);return}
  if(el.id==="itemQ"){itemQ=el.value;const p=el.selectionStart;render();const n=$("#itemQ");n.focus();n.setSelectionRange(p,p);return}
  if(el.classList.contains("qty")){
    const o=cur();if(!o)return;const it=o.items.find(i=>"q-"+i.id===el.id);if(!it)return;
    const raw=toLatin(el.value).replace(/[^\d]/g,"");
    if(raw!==el.value&&raw!==toLatin(el.value))el.value=raw;
    it.qty=raw===""?0:parseInt(raw,10);
    el.closest(".it").classList.toggle("has",it.qty>0);
    renderFoot();persistSoon(o);
    document.querySelectorAll(".tabb").forEach(b=>{const ci=o.items.filter(i=>catOf(i)===b.dataset.tab);const f=ci.filter(i=>qtyOf(i)>0).length;b.querySelector("span").textContent=f?ar(f)+" مكتوب":ar(ci.length)+" صنف"});
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("rrow")){e.target.click();return}
  if(e.key!=="Enter"||!e.target.classList.contains("qty"))return;
  e.preventDefault();
  const all=[...document.querySelectorAll(".qty")];const i=all.indexOf(e.target);
  if(all[i+1]){all[i+1].focus();all[i+1].select()}else{e.target.blur();$("#aName")?.focus()}
});
document.addEventListener("focusin",e=>{if(e.target.classList.contains("qty"))setTimeout(()=>{try{e.target.select()}catch(_){}},0)});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.sent){const so=orders.find(x=>x.id===e.target.dataset.sent);if(so){so.sent=e.target.value==="1";so.sentAt=so.sent?Date.now():null;persist(so);e.target.className="sent "+(so.sent?"yes":"no");toast(so.sent?"اتعلّمت إنها اتبعتت":"اتعلّمت إنها لسه ما اتبعتتش")}return}
  const o=cur();if(!o)return;
  if(e.target.id==="oDate"){o.date=e.target.value;persist(o)}
  if(e.target.classList.contains("unit")){const it=o.items.find(i=>"u-"+i.id===e.target.id);if(it){it.unit=e.target.value;persistSoon(o)}}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="addForm")return;e.preventDefault();
  const o=cur();if(!o)return;
  const name=$("#aName").value.trim(), qty=parseInt(toLatin($("#aQty").value),10), g=$("#aGrp").value;
  if(!name||!(qty>0)){toast("اكتب اسم الصنف وعدد أكبر من صفر");return}
  const ex=o.items.find(i=>i.name.trim()===name);
  if(ex){ex.qty=qtyOf(ex)+qty;toast(`زوّدت ${name} بـ ${ar(qty)}`)}
  else o.items.push({id:uid(),name,qty,cat:tab,...(DEF_UNIT[name]?{unit:DEF_UNIT[name]}:{}),...(g==="__sep"?{sep:true}:g?{group:g}:{})});
  persist(o);render();$("#aName").focus();
});
window.addEventListener("scroll",()=>{const t=$(".top");if(t)t.classList.toggle("scrolled",window.scrollY>4)},{passive:true});
window.addEventListener("beforeunload",flush);

render();
boot();
</script>

</body>
</html>
